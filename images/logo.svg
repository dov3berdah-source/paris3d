<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="70%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e5e5"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <path id="topArc" d="M 80,200 A 120,120 0 0 1 320,200" fill="none"/>
    <path id="bottomArc" d="M 320,200 A 120,120 0 0 1 80,200" fill="none"/>
  </defs>

  <!-- Outer silver ring -->
  <circle cx="200" cy="200" r="195" fill="url(#silver)"/>
  <circle cx="200" cy="200" r="180" fill="#fff"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Inner black circle -->
  <circle cx="200" cy="200" r="155" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="#D42B2B" stroke-width="3"/>

  <!-- Crosshair / target lines -->
  <line x1="200" y1="50" x2="200" y2="350" stroke="#D42B2B" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#D42B2B" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#D42B2B" stroke-width="1" opacity="0.4"/>

  <!-- Top text on arc -->
  <text font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#000">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      DÉRATISATION • DÉSINSECTISATION • DÉSINFECTION
    </textPath>
  </text>

  <!-- Bottom text on arc -->
  <text font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="#000">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      PUNAISE DE LIT • SYNDROME DE DIOGÈNE • DÉBARRAS
    </textPath>
  </text>

  <!-- Red dots separators (decorative) -->
  <circle cx="200" cy="22" r="4" fill="#D42B2B"/>
  <circle cx="200" cy="378" r="4" fill="#D42B2B"/>

  <!-- Central banner -->
  <rect x="40" y="170" width="320" height="60" fill="#0a0a0a" stroke="#D42B2B" stroke-width="1.5"/>
  <polygon points="40,170 30,180 30,220 40,230" fill="#0a0a0a" stroke="#D42B2B" stroke-width="1.5"/>
  <polygon points="360,170 370,180 370,220 360,230" fill="#0a0a0a" stroke="#D42B2B" stroke-width="1.5"/>

  <!-- Eiffel Tower silhouette behind P -->
  <g transform="translate(98, 178)" fill="#fff" opacity="0.95">
    <path d="M 8,40 L 12,12 L 16,40 Z M 4,42 L 20,42 L 18,46 L 6,46 Z M 7,46 L 17,46 L 15,52 L 9,52 Z"/>
  </g>

  <!-- PARIS text -->
  <text x="120" y="222" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="56" fill="#fff" letter-spacing="2">PARIS</text>

  <!-- 3D text (red) -->
  <text x="265" y="222" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="56" fill="#D42B2B" letter-spacing="2">3D</text>

  <!-- Bottom URL -->
  <text x="200" y="258" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff" text-anchor="middle">Paris3D.fr</text>

  <!-- Top icons row (3 pest icons - rats x2, bedbug) -->
  <g transform="translate(135, 95)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">🐀</text>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#D42B2B" stroke-width="3"/>
  </g>
  <g transform="translate(200, 80)">
    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="7" font-size="24" text-anchor="middle">🐭</text>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#D42B2B" stroke-width="3"/>
  </g>
  <g transform="translate(265, 95)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="6" font-size="20" text-anchor="middle">🪲</text>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#D42B2B" stroke-width="3"/>
  </g>

  <!-- Bottom icons row (mosquito, wasp, hornet) -->
  <g transform="translate(135, 305)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="6" font-size="20" text-anchor="middle">🦟</text>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#D42B2B" stroke-width="3"/>
  </g>
  <g transform="translate(200, 320)">
    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="7" font-size="24" text-anchor="middle">🐝</text>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#D42B2B" stroke-width="3"/>
  </g>
  <g transform="translate(265, 305)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#D42B2B" stroke-width="2.5"/>
    <text x="0" y="6" font-size="20" text-anchor="middle">🐝</text>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#D42B2B" stroke-width="3"/>
  </g>

  <!-- Decorative rivets -->
  <circle cx="20" cy="200" r="4" fill="#888"/>
  <circle cx="380" cy="200" r="4" fill="#888"/>
</svg>
